name: Privisas SEO Rank Watch

on:
  workflow_dispatch:

  schedule:
    # Her gün 09:00 Türkiye saati
    - cron: "0 6 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: privisas-seo-rank-watch
  cancel-in-progress: false

jobs:
  seo-rank-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/153968183926/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: privisas-seo-agent@privisas-seo-agent.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client python-dotenv requests beautifulsoup4

      - name: Review due SEO experiments
        env:
          GSC_SITE_URL: sc-domain:privisas.com
          PYTHONPATH: .
        run: |
          python data_sources/seo_review.py

      - name: Run Privisas SEO Rank Watch
        env:
          GSC_SITE_URL: sc-domain:privisas.com
          PYTHONPATH: .
        run: |
          python data_sources/seo_rank_watch.py

      - name: Prepare SEO Content Gap Task
        env:
          GSC_SITE_URL: sc-domain:privisas.com
          PYTHONPATH: .
        run: |
          python data_sources/seo_content_gap.py

      - name: Save SEO data
        run: |
          git config user.name "Privisas SEO Agent"
          git config user.email "seo-agent@privisas.com"

          if git diff --quiet -- data/seo/; then
            echo "No SEO data changes to commit."
          else
            git add data/seo/
            git commit -m "Update Privisas SEO Rank Watch data"
            git push
          fi
