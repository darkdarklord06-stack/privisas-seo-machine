name: Privisas GSC Module Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-gsc-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/153968183926/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: privisas-seo-agent@privisas-seo-agent.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install dependencies
        run: |
          python -m pip install --quiet google-auth google-api-python-client python-dotenv

      - name: Test Privisas GSC module
        run: |
          python - <<'PY'
          from data_sources.modules.google_search_console import GoogleSearchConsole

          gsc = GoogleSearchConsole()

          rows = gsc.get_keyword_positions(days=28, limit=10)

          print("✅ Privisas GSC module works")
          print("----------------------------")

          for row in rows:
              print(
                  f"{row['keyword']} | "
                  f"clicks={row['clicks']} | "
                  f"impressions={row['impressions']} | "
                  f"position={row['position']}"
              )
          PY
