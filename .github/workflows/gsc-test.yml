name: Privisas GSC Read Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  read-gsc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/153968183926/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: privisas-seo-agent@privisas-seo-agent.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly

      - name: Read Search Console queries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta

          site_url = "sc-domain:privisas.com"

          end_date = date.today() - timedelta(days=3)
          start_date = end_date - timedelta(days=27)

          token = os.environ["CLOUDSDK_AUTH_ACCESS_TOKEN"]

          encoded_site = urllib.parse.quote(site_url, safe="")
          url = f"https://www.googleapis.com/webmasters/v3/sites/{encoded_site}/searchAnalytics/query"

          body = {
              "startDate": start_date.isoformat(),
              "endDate": end_date.isoformat(),
              "dimensions": ["query"],
              "rowLimit": 10
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          print(f"GSC period: {start_date} -> {end_date}")
          print("")
          print("Top queries:")
          print("")

          for row in data.get("rows", []):
              query = row["keys"][0]
              clicks = row.get("clicks", 0)
              impressions = row.get("impressions", 0)
              ctr = row.get("ctr", 0) * 100
              position = row.get("position", 0)

              print(
                  f"{query} | "
                  f"clicks={clicks:.0f} | "
                  f"impressions={impressions:.0f} | "
                  f"CTR={ctr:.2f}% | "
                  f"position={position:.2f}"
              )
          PY
