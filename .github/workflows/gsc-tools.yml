name: Privisas GSC Tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: "sitemap | inspect | performance | queries"
        required: true
        default: inspect
      urls:
        description: "Virgülle ayrılmış URL listesi (inspect) veya sitemap URL'si"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  gsc-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/153968183926/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: privisas-seo-agent@privisas-seo-agent.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth google-api-python-client
      - name: Run GSC tool
        env:
          GSC_SITE_URL: sc-domain:privisas.com
          GSC_ACTION: ${{ inputs.action }}
          GSC_URLS: ${{ inputs.urls }}
        run: python data_sources/gsc_tools.py
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-tools-result
          path: output/gsc-tools-result.json
